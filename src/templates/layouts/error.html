---
layout: default
---

{% assign home_url = "/" %}
{% if page.lang != site.default_lang %}{% assign home_url = "/" | append: page.lang | append: "/" %}{% endif %}

<section class="hero">
    <span class="eyebrow">~/404</span>
    <h1 class="display" style="margin-block: 1rem .75rem;">{{ page.title }}</h1>
    <p class="lead">{{ page.description }}</p>
    <div class="hero-actions">
        <a class="button primary" href="{{ home_url }}">
            <ion-icon name="arrow-back-outline"></ion-icon> {{ 'nav.me' | t: page.lang }}
        </a>
    </div>
    <div class="prose" style="margin-top: 2rem;">{{ content }}</div>
</section>
