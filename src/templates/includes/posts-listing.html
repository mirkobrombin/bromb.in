{% assign post = include.post %}
{% if post.published %}
<a class="post-item" href="{{ post.url }}">
    <time datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%a, %b %e, %Y" }}</time>
    <div>
        <h3>{{ post.title }}</h3>
        <p>{% if post.description %}{{ post.description }}{% else %}{{ post.content | strip_html | truncatewords: 28 }}{% endif %}</p>
    </div>
    <ion-icon class="arrow" name="arrow-forward-outline"></ion-icon>
</a>
{% endif %}
